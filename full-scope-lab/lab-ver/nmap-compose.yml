version: "3.8"
services:
  target:
    image: lscr.io/linuxserver/nginx:latest
    container_name: target
    networks:
      - scan_net
    # Add more services (e.g., sshd, mysql) for richer demos

  attacker:
    image: kalilinux/kali-rolling
    container_name: attacker
    network_mode: "service:target"  # shares target's netns, or use a separate bridge
    privileged: true
    stdin_open: true
    tty: true
    depends_on:
      - target

  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    privileged: true
    networks:
      - scan_net
    # Configure to monitor the bridge interface
    command: >
      suricata -i eth0
      --set homenet.net:172.20.0.0/16
      --set af-packet.mmap-queue:1

networks:
  scan_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16   